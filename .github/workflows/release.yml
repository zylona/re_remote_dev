name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Build release checks and artifact
        run: |
          ./scripts/release_check.sh
          RELEASE_VERSION="${GITHUB_REF_NAME#v}" SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" ./scripts/build_orchestrator_release.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
