---
all:
  vars:
    remote_dev:
      schema_version: 1
      target_user: developer
      initial_user: developer
      ssh_private_key_file: ~/.ssh/id_ed25519
      manage_sshd_forwarding: true
      profile: default
      proxy:
        mode: auto
        host: 127.0.0.1
        port: 4227
        remote_port_range: [40000, 60000]
      shell:
        install_omarchy_compat: true
        history_mode: shared
      versions:
        zellij: latest
        mise: latest
        fzf: latest
        zoxide: latest
  children:
    remote_dev_targets:
      hosts:
        example:
          ansible_host: 192.0.2.10
          ansible_port: 22
          ansible_user: developer
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
