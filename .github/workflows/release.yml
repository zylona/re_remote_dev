name: release

on:
  push:
    branches: [master, dev]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Build release checks and artifact
        run: |
          ./scripts/release_check.sh
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            release_version="$(tr -d '[:space:]' < VERSION)-${GITHUB_SHA::7}"
          fi
          RELEASE_VERSION="$release_version" SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" ./scripts/build_orchestrator_release.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-dev-orchestrator-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          # Actions artifacts are CI hand-off files, not the public distribution channel.
          # Public repositories support a maximum retention of 90 days.
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: remote-dev-orchestrator-${{ github.sha }}
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
