---
- name: 检查基础下载工具
  ansible.builtin.command:
    argv: [sh, -c, "command -v {{ item }}"]
  loop: "{{ tools_required_commands }}"
  register: tools_prereq_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
- name: 缺少基础下载工具时直接失败
  ansible.builtin.assert:
    that:
      - (tools_prereq_check.results | selectattr('rc', 'ne', 0) | list | length) == 0
    fail_msg: >-
      目标机缺少项目安装所需基础工具：{{ tools_prereq_check.results
      | selectattr('rc', 'ne', 0) | map(attribute='item') | list | join(', ') }}。
      请用户按发行版安装后重试。
- name: 创建用户工具目录
  ansible.builtin.file:
    path: "{{ tools_install_dir }}"
    state: directory
    mode: '0755'
- name: 映射目标架构
  ansible.builtin.set_fact:
    tools_release_arch: "{{ {'x86_64': 'x86_64', 'amd64': 'x86_64', 'aarch64': 'aarch64', 'arm64': 'aarch64'}.get(ansible_facts.architecture, '') }}"
    tools_fzf_arch: "{{ {'x86_64': 'amd64', 'amd64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}.get(ansible_facts.architecture, '') }}"
- name: 拒绝不支持的目标架构
  ansible.builtin.assert:
    that: tools_release_arch | length > 0
    fail_msg: "目标架构 {{ ansible_facts.architecture }} 暂不支持，当前支持 x86_64/amd64、aarch64/arm64。"
- name: 探测 libc 类型
  ansible.builtin.command:
    argv: [sh, -c, "ldd --version 2>&1 | head -1"]
  register: tools_libc_probe
  changed_when: false
  failed_when: false
- name: 创建 release 缓存目录
  ansible.builtin.file:
    path: "{{ tools_cache_dir }}"
    state: directory
    mode: '0755'
- name: 创建下载 curl 兼容目录
  ansible.builtin.file:
    path: "{{ tools_curl_bin }}"
    state: directory
    mode: '0700'
  when: not (tools_offline | bool)
- name: 创建控制端下载缓存目录
  ansible.builtin.file:
    path: "{{ tools_controller_cache_dir }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  when: not (tools_offline | bool)
- name: 写入下载 curl TLS 兼容包装器
  ansible.builtin.copy:
    content: |
      #!/usr/bin/python3
      import os
      import sys
      import urllib.request

      args = sys.argv[1:]
      url = next((item for item in reversed(args) if item.startswith(("http://", "https://"))), None)
      if not url:
          print("curl compatibility wrapper: URL is required", file=sys.stderr)
          raise SystemExit(2)
      output = None
      for index, item in enumerate(args[:-1]):
          if item == "-o" or item.endswith("o") and item.startswith("-"):
              output = args[index + 1]
              break
      proxies = {}
      for name in ("http_proxy", "https_proxy"):
          if os.environ.get(name):
              proxies[name] = os.environ[name]
      opener = urllib.request.build_opener(urllib.request.ProxyHandler(proxies))
      request = urllib.request.Request(
          url,
          headers={
              # Cloudflare-backed release endpoints reject urllib's default
              # Python user agent (the real curl client is accepted).
              "User-Agent": "curl/8.0 (remote-dev compatibility)",
              "Accept": "*/*",
              "Accept-Encoding": "gzip, deflate",
          },
      )
      with opener.open(request, timeout=180) as response:
          data = response.read()
      if output:
          with open(output, "wb") as stream:
              stream.write(data)
      else:
          sys.stdout.buffer.write(data)
    dest: "{{ tools_curl_bin }}/curl"
    mode: '0755'
  when: not (tools_offline | bool)
- name: 检查控制端 mise 安装脚本缓存
  ansible.builtin.stat:
    path: "{{ tools_controller_cache_dir }}/mise-install.sh"
  register: tools_mise_cache
  delegate_to: localhost
  become: false
- name: 下载 mise 官方安装脚本（Python HTTPS 客户端）
  when:
    - not (tools_offline | bool)
    - not tools_mise_cache.stat.exists
  ansible.builtin.get_url:
    url: https://mise.run
    dest: "{{ tools_controller_cache_dir }}/mise-install.sh"
    mode: '0700'
    force: false
    timeout: 120
  retries: 5
  delay: 3
  until: tools_mise_download is succeeded
  register: tools_mise_download
  delegate_to: localhost
  become: false
  environment:
    http_proxy: "{{ tools_controller_proxy_url }}"
    https_proxy: "{{ tools_controller_proxy_url }}"
- name: 复制 mise 官方安装脚本到目标机
  ansible.builtin.copy:
    src: "{{ tools_controller_cache_dir }}/mise-install.sh"
    dest: "{{ tools_cache_dir }}/mise-install.sh"
    mode: '0700'
  when: not (tools_offline | bool)
- name: 检查控制端现有 mise 二进制
  ansible.builtin.stat:
    path: "{{ tools_controller_mise_path }}"
  register: tools_controller_mise
  delegate_to: localhost
  become: false
- name: 使用控制端 mise 二进制作为下载失败回退
  ansible.builtin.copy:
    src: "{{ tools_controller_mise_path }}"
    dest: "{{ tools_install_dir }}/mise"
    mode: '0755'
  when:
    - not (tools_offline | bool)
    - tools_controller_mise.stat.exists | default(false)
    - not (tools_install_dir + '/mise') is file
- name: 使用 mise 官方安装脚本
  when:
    - not (tools_offline | bool)
    - not (tools_controller_mise.stat.exists | default(false))
  ansible.builtin.command:
    argv: [sh, "{{ tools_cache_dir }}/mise-install.sh"]
  environment:
    HOME: "{{ ansible_facts.user_dir }}"
    MISE_INSTALL_PATH: "{{ tools_install_dir }}/mise"
    PATH: "{{ tools_curl_bin }}:{{ ansible_facts.user_dir }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
    http_proxy: "{{ remote_dev_temp_proxy_url | default(omit) }}"
    https_proxy: "{{ remote_dev_temp_proxy_url | default(omit) }}"
- name: 检查控制端现有 zoxide 二进制
  ansible.builtin.stat:
    path: "{{ tools_controller_zoxide_path }}"
  register: tools_controller_zoxide
  delegate_to: localhost
  become: false
- name: 使用控制端 zoxide 二进制作为下载失败回退
  ansible.builtin.copy:
    src: "{{ tools_controller_zoxide_path }}"
    dest: "{{ tools_install_dir }}/zoxide"
    mode: '0755'
  when:
    - not (tools_offline | bool)
    - tools_controller_zoxide.stat.exists | default(false)
    - not (tools_install_dir + '/zoxide') is file
- name: 下载 zoxide 官方安装脚本（Python HTTPS 客户端）
  when:
    - not (tools_offline | bool)
    - not (tools_controller_zoxide.stat.exists | default(false))
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh
    dest: "{{ tools_controller_cache_dir }}/zoxide-install.sh"
    mode: '0700'
    force: false
    timeout: 120
  retries: 5
  delay: 3
  until: tools_zoxide_download is succeeded
  register: tools_zoxide_download
  delegate_to: localhost
  become: false
  environment:
    http_proxy: "{{ tools_controller_proxy_url }}"
    https_proxy: "{{ tools_controller_proxy_url }}"
- name: 复制 zoxide 官方安装脚本到目标机
  ansible.builtin.copy:
    src: "{{ tools_controller_cache_dir }}/zoxide-install.sh"
    dest: "{{ tools_cache_dir }}/zoxide-install.sh"
    mode: '0700'
  when:
    - not (tools_offline | bool)
    - not (tools_controller_zoxide.stat.exists | default(false))
- name: 使用 zoxide 官方安装脚本
  when:
    - not (tools_offline | bool)
    - not (tools_controller_zoxide.stat.exists | default(false))
  ansible.builtin.command:
    argv: [sh, "{{ tools_cache_dir }}/zoxide-install.sh"]
  environment:
    HOME: "{{ ansible_facts.user_dir }}"
    PATH: "{{ tools_curl_bin }}:{{ ansible_facts.user_dir }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
    http_proxy: "{{ remote_dev_temp_proxy_url | default(omit) }}"
    https_proxy: "{{ remote_dev_temp_proxy_url | default(omit) }}"
- name: 检查控制端 zellij release 缓存
  ansible.builtin.stat:
    path: "{{ tools_controller_cache_dir }}/zellij.tar.gz"
  register: tools_zellij_cache
  delegate_to: localhost
  become: false
- name: 下载 zellij 官方 release（Python HTTPS 客户端）
  # A proxy may reset TLS after delivering the complete archive; a cached
  # valid archive must not be downloaded again on every retry.
  when:
    - not (tools_offline | bool)
    - not tools_zellij_cache.stat.exists
  ansible.builtin.get_url:
    url: "https://github.com/zellij-org/zellij/releases/download/v{{ tools_zellij_version }}/zellij-{{ tools_release_arch }}-unknown-linux-musl.tar.gz"
    dest: "{{ tools_controller_cache_dir }}/zellij.tar.gz"
    mode: '0600'
    force: false
    timeout: 180
  retries: 5
  delay: 3
  until: tools_zellij_download is succeeded
  register: tools_zellij_download
  delegate_to: localhost
  become: false
  environment:
    http_proxy: "{{ tools_controller_proxy_url }}"
    https_proxy: "{{ tools_controller_proxy_url }}"
- name: 复制 zellij 官方 release 到目标机
  ansible.builtin.copy:
    src: "{{ tools_controller_cache_dir }}/zellij.tar.gz"
    dest: "{{ tools_cache_dir }}/zellij.tar.gz"
    mode: '0600'
  when: not (tools_offline | bool)
- name: 解压 zellij 官方 release
  when:
    - not (tools_offline | bool)
    - not (tools_install_dir + '/zellij') is file
  ansible.builtin.unarchive:
    src: "{{ tools_cache_dir }}/zellij.tar.gz"
    dest: "{{ tools_install_dir }}"
    remote_src: true
    creates: "{{ tools_install_dir }}/zellij"
- name: 检查控制端 fzf release 缓存
  ansible.builtin.stat:
    path: "{{ tools_controller_cache_dir }}/fzf.tar.gz"
  register: tools_fzf_cache
  delegate_to: localhost
  become: false
- name: 检查控制端现有 fzf 二进制
  ansible.builtin.stat:
    path: "{{ tools_controller_fzf_path }}"
  register: tools_controller_fzf
  delegate_to: localhost
  become: false
- name: 使用控制端 fzf 二进制作为下载失败回退
  ansible.builtin.copy:
    src: "{{ tools_controller_fzf_path }}"
    dest: "{{ tools_install_dir }}/fzf"
    mode: '0755'
  when:
    - not (tools_offline | bool)
    - tools_controller_fzf.stat.exists | default(false)
    - not (tools_install_dir + '/fzf') is file
- name: 下载 fzf 官方 release（Python HTTPS 客户端）
  when:
    - not (tools_offline | bool)
    - not (tools_controller_fzf.stat.exists | default(false))
    - not tools_fzf_cache.stat.exists
  ansible.builtin.get_url:
    url: "https://github.com/junegunn/fzf/releases/download/v{{ tools_fzf_version }}/fzf-{{ tools_fzf_version }}-linux_{{ tools_fzf_arch }}.tar.gz"
    dest: "{{ tools_controller_cache_dir }}/fzf.tar.gz"
    mode: '0600'
    force: false
    timeout: 180
  retries: 5
  delay: 3
  until: tools_fzf_download is succeeded
  register: tools_fzf_download
  delegate_to: localhost
  become: false
  environment:
    http_proxy: "{{ tools_controller_proxy_url }}"
    https_proxy: "{{ tools_controller_proxy_url }}"
- name: 复制 fzf 官方 release 到目标机
  ansible.builtin.copy:
    src: "{{ tools_controller_cache_dir }}/fzf.tar.gz"
    dest: "{{ tools_cache_dir }}/fzf.tar.gz"
    mode: '0600'
  when:
    - not (tools_offline | bool)
    - not (tools_controller_fzf.stat.exists | default(false))
- name: 解压 fzf 官方 release
  when:
    - not (tools_offline | bool)
    - not (tools_install_dir + '/fzf') is file
  ansible.builtin.unarchive:
    src: "{{ tools_cache_dir }}/fzf.tar.gz"
    dest: "{{ tools_install_dir }}"
    remote_src: true
    creates: "{{ tools_install_dir }}/fzf"
- name: 离线模式检查工具
  ansible.builtin.stat:
    path: "{{ tools_install_dir }}/{{ item }}"
  loop: [mise, zoxide, zellij, fzf]
  register: tools_offline_check
  when: tools_offline | bool
- name: 离线模式缺少工具时失败
  ansible.builtin.assert:
    that: tools_offline_check.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: "离线模式缺少工具：{{ tools_offline_check.results | rejectattr('stat.exists') | map(attribute='item') | list | join(', ') }}"
  when: tools_offline | bool
- name: 验证用户工具安装结果
  ansible.builtin.command:
    argv: ["{{ tools_install_dir }}/{{ item }}", --version]
  loop: [mise, zoxide, zellij, fzf]
  changed_when: false
- name: 校验工具 SHA256（提供清单时启用）
  ansible.builtin.stat:
    path: "{{ tools_install_dir }}/{{ item.key }}"
  loop: "{{ tools_checksums | dict2items }}"
  register: tools_checksum_files
  when: tools_checksums | length > 0
- name: 执行工具 SHA256 校验
  ansible.builtin.command:
    argv: [sha256sum, "{{ tools_install_dir }}/{{ item.item.key }}"]
  loop: "{{ tools_checksum_files.results | default([]) }}"
  register: tools_checksum_results
  changed_when: false
  failed_when: item.stdout.split()[0] != item.item.value
  when: tools_checksums | length > 0
- name: 导出用户工具缓存归档  # noqa command-instead-of-shell command-instead-of-module
  ansible.builtin.shell:
    cmd: "tar -czf {{ tools_cache_archive }} -C {{ tools_install_dir }} mise zoxide zellij fzf"
    creates: "{{ tools_cache_archive }}"
  when: tools_cache_archive | length > 0
